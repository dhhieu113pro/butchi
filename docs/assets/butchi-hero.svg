<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-label="Butchi — Translate and Rewrite anywhere with a private local LLM">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#071126"/>
      <stop offset="55%" stop-color="#0d1735"/>
      <stop offset="100%" stop-color="#17144a"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#20b8ff"/>
      <stop offset="40%" stop-color="#6d60ff"/>
      <stop offset="72%" stop-color="#e650d5"/>
      <stop offset="100%" stop-color="#ff9838"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#000" flood-opacity=".35"/>
    </filter>
  </defs>
  <rect width="1200" height="640" rx="28" fill="url(#bg)"/>
  <rect x="1" y="1" width="1198" height="638" rx="27" fill="none" stroke="#5a67a4" stroke-opacity=".45"/>

  <g transform="translate(62 62)">
    <rect width="112" height="112" rx="30" fill="#091127" stroke="url(#brand)" stroke-width="4"/>
    <path d="M28 28v58" stroke="#f7f8ff" stroke-width="10" stroke-linecap="round"/>
    <path d="M49 37h38M49 57h29M49 77h21" stroke="url(#brand)" stroke-width="9" stroke-linecap="round"/>
    <path d="M83 78a26 26 0 1 1-31 27" fill="none" stroke="url(#brand)" stroke-width="8" stroke-linecap="round"/>
    <path d="M50 104l9-1-4-8z" fill="#ff8e35"/>
  </g>

  <text x="200" y="105" fill="#fff" font-family="Segoe UI,Arial,sans-serif" font-size="58" font-weight="750">Butchi</text>
  <text x="202" y="148" fill="#aeb8d8" font-family="Segoe UI,Arial,sans-serif" font-size="24">Local AI for writing, right where you type.</text>

  <text x="64" y="245" fill="#fff" font-family="Segoe UI,Arial,sans-serif" font-size="50" font-weight="750">Translate &amp; Rewrite</text>
  <text x="64" y="300" fill="url(#brand)" font-family="Segoe UI,Arial,sans-serif" font-size="50" font-weight="750">anywhere.</text>
  <text x="64" y="350" fill="#c8d0e8" font-family="Segoe UI,Arial,sans-serif" font-size="24">Select text → instant popover → polished result.</text>
  <text x="64" y="385" fill="#c8d0e8" font-family="Segoe UI,Arial,sans-serif" font-size="24">Runs with your local GGUF model — private and offline.</text>

  <g font-family="Segoe UI,Arial,sans-serif">
    <g transform="translate(64 438)">
      <rect width="198" height="116" rx="18" fill="#121d3c" stroke="#31406e"/>
      <text x="22" y="38" font-size="26">⚡</text><text x="58" y="38" fill="#fff" font-size="18" font-weight="700">Instant</text>
      <text x="22" y="72" fill="#aeb8d8" font-size="16">Popover beside</text><text x="22" y="95" fill="#aeb8d8" font-size="16">your selection</text>
    </g>
    <g transform="translate(278 438)">
      <rect width="198" height="116" rx="18" fill="#121d3c" stroke="#31406e"/>
      <text x="22" y="38" font-size="26">🔒</text><text x="58" y="38" fill="#fff" font-size="18" font-weight="700">Private</text>
      <text x="22" y="72" fill="#aeb8d8" font-size="16">Local inference</text><text x="22" y="95" fill="#aeb8d8" font-size="16">on your machine</text>
    </g>
    <g transform="translate(492 438)">
      <rect width="198" height="116" rx="18" fill="#121d3c" stroke="#31406e"/>
      <text x="22" y="38" font-size="26">🧠</text><text x="58" y="38" fill="#fff" font-size="18" font-weight="700">Local LLM</text>
      <text x="22" y="72" fill="#aeb8d8" font-size="16">GGUF via</text><text x="22" y="95" fill="#aeb8d8" font-size="16">llama.cpp</text>
    </g>
  </g>

  <g transform="translate(735 190)" filter="url(#shadow)" font-family="Segoe UI,Arial,sans-serif">
    <rect width="405" height="365" rx="24" fill="#0b1329" stroke="#566180"/>
    <text x="26" y="42" fill="#41a9ff" font-size="20" font-weight="700">Translate</text>
    <text x="126" y="42" fill="#b8c0d8" font-size="20">Rewrite</text>
    <rect x="22" y="66" width="361" height="78" rx="14" fill="#111b34" stroke="#2e3b60"/>
    <text x="38" y="92" fill="#8f9bbd" font-size="14">Source</text>
    <text x="38" y="120" fill="#fff" font-size="18">Please rewrite this email more politely.</text>
    <rect x="22" y="158" width="361" height="84" rx="14" fill="#111b34" stroke="#ff8b37" stroke-width="2"/>
    <text x="38" y="187" fill="#ff9a39" font-size="15" font-weight="700">Translate · vi</text>
    <text x="38" y="219" fill="#fff" font-size="17">Vui lòng viết lại email này lịch sự hơn.</text>
    <rect x="22" y="256" width="361" height="84" rx="14" fill="#111b34" stroke="#31a9ff" stroke-width="2"/>
    <text x="38" y="285" fill="#48b5ff" font-size="15" font-weight="700">Rewrite</text>
    <text x="38" y="317" fill="#fff" font-size="17">Could you rewrite this in a more polite tone?</text>
  </g>

  <text x="64" y="605" fill="#8f9bbd" font-family="Segoe UI,Arial,sans-serif" font-size="16">Windows-first · Global hotkeys · System / Light / Dark · Open source</text>
</svg>
