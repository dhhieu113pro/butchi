<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Settings — Rust Rewrite</title>
    <link rel="stylesheet" href="/src/settings.css" />
    <script type="module" src="/src/settings.ts" defer></script>
  </head>
  <body>
    <main class="settings">
      <header class="settings__header">
        <h1>Settings</h1>
        <p class="settings__lead">Configure actions and the local LLM.</p>
      </header>

      <section class="card">
        <h2>Actions</h2>
        <label class="row">
          <span>Enable Translate</span>
          <input id="translateEnabled" type="checkbox" />
        </label>
        <label class="row">
          <span>Enable Rewrite</span>
          <input id="rewriteEnabled" type="checkbox" />
        </label>
        <label class="field">
          <span>Target language (Translate)</span>
          <select id="targetLanguage">
            <option>Vietnamese</option>
            <option>English</option>
            <option>Chinese (Simplified)</option>
            <option>Chinese (Traditional)</option>
            <option>Japanese</option>
            <option>Korean</option>
            <option>French</option>
            <option>German</option>
            <option>Spanish</option>
            <option>Portuguese</option>
            <option>Thai</option>
            <option>Indonesian</option>
          </select>
        </label>
      </section>

      <section class="card">
        <h2>Rewrite prompt</h2>
        <label class="field">
          <span>System prompt</span>
          <textarea id="rewriteSystemPrompt" rows="5" spellcheck="true"></textarea>
        </label>
      </section>

      <section class="card">
        <h2>Local LLM</h2>
        <p class="hint">
          Default model is <strong>Qwen3.5 0.8B</strong> (GGUF). Download once, then load into memory.
          GPU offload requires building with <code>--features cuda</code> or <code>--features vulkan</code>.
        </p>
        <label class="field">
          <span>Model</span>
          <select id="modelSelect"></select>
        </label>
        <div class="status-line" id="modelStatus">Checking model…</div>
        <div class="btn-row">
          <button type="button" class="btn" id="downloadBtn">Download</button>
          <button type="button" class="btn btn--primary" id="loadBtn">Load model</button>
        </div>
        <label class="field">
          <span>Max tokens</span>
          <input id="maxTokens" type="number" min="32" max="1024" step="16" />
        </label>
        <label class="field">
          <span>Temperature</span>
          <input id="temperature" type="number" min="0" max="1.5" step="0.05" />
        </label>
        <label class="field">
          <span>GPU layers (cuda/vulkan builds)</span>
          <input id="gpuLayers" type="number" min="0" max="999" step="1" />
        </label>
      </section>

      <footer class="settings__footer">
        <p class="hint" id="saveStatus" aria-live="polite"></p>
        <button type="button" class="btn btn--primary" id="saveBtn">Save settings</button>
      </footer>
    </main>
  </body>
</html>
