<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      (() => {
        const theme = localStorage.getItem("butchi.theme");
        if (theme === "light" || theme === "dark") {
          document.documentElement.dataset.theme = theme;
        }
      })();
    </script>
    <link rel="stylesheet" href="/src/popover.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Butchi — Text actions</title>
    <script type="module" src="/src/screenshot-mode.ts" defer></script>
    <script type="module" src="/src/main.ts" defer></script>
  </head>

  <body>
    <main class="popover" aria-label="Text actions">
      <section class="source-block">
        <header class="block-head">
          <span class="block-title">Source</span>
        </header>
        <p class="selection" title="Selected text">me and him goes to store yesterday</p>
        <textarea
          class="manual-input"
          rows="3"
          placeholder="Type or paste text…"
          aria-label="Text to translate or rewrite"
          hidden
        ></textarea>
      </section>

      <div class="results" id="results">
        <section class="result-card" data-kind="translate" hidden>
          <header class="block-head">
            <span class="block-title">Translate</span>
            <span class="result-state" data-role="state">…</span>
          </header>
          <div class="language-targets" id="favoriteLanguageButtons" aria-label="Favorite translation targets"></div>
          <p class="result-text" data-role="text"></p>
        </section>
        <section class="result-card" data-kind="rewrite" hidden>
          <header class="block-head">
            <span class="block-title">Rewrite</span>
            <span class="result-state" data-role="state">…</span>
          </header>
          <p class="result-text" data-role="text"></p>
        </section>
      </div>

      <div class="actions" role="group" aria-label="Choose a text action">
        <button class="action" type="button" data-action="translate">
          <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M4 5h8M8 3v2m3 0c-.8 3.3-3.2 6.1-6.5 7.5M6 8c1.1 2 2.8 3.7 5 4.7M14 19l3.2-8 3.3 8m-5.3-3h4"/></svg>
          <span class="action__label">Translate</span>
          <span class="action__state" aria-hidden="true"></span>
        </button>
        <button class="action action--primary" type="button" data-action="rewrite">
          <svg aria-hidden="true" viewBox="0 0 24 24"><path d="m4 20 4.2-1 10.9-10.9a2.1 2.1 0 0 0-3-3L5.2 16 4 20Zm10.5-13.3 3 3M12 20h8"/></svg>
          <span class="action__label">Rewrite</span>
          <span class="action__state" aria-hidden="true"></span>
        </button>
      </div>
      <p class="status" aria-live="polite">Choose an action for the selected text.</p>
    </main>
  </body>
</html>
