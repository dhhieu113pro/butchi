<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      (() => {
        const theme = localStorage.getItem("butchi.theme");
        if (theme === "light" || theme === "dark") {
          document.documentElement.dataset.theme = theme;
        }
      })();
    </script>
    <link rel="stylesheet" href="/src/popover-v2.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Butchi — Text actions</title>
    <script type="module" src="/src/screenshot-mode.ts" defer></script>
    <script type="module" src="/src/popover-runtime.ts" defer></script>
  </head>

  <body>
    <main class="popover" aria-label="Text actions">
      <button type="button" class="close-btn" id="closeBtn" title="Close (Esc)" aria-label="Close">
        <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg>
      </button>

      <section class="source-block">
        <header class="block-head">
          <span class="block-title">Source</span>
        </header>
        <p class="selection" title="Selected text">me and him goes to store yesterday</p>
        <textarea
          class="manual-input"
          rows="3"
          placeholder="Type or paste text…"
          aria-label="Text to translate or rewrite"
          hidden
        ></textarea>
      </section>

      <div class="results" id="results">
        <section class="result-card" data-kind="translate" hidden>
          <header class="block-head">
            <span class="block-title">Translate</span>
            <span class="result-state" data-role="state"></span>
          </header>
          <div class="language-targets" id="favoriteLanguageButtons" aria-label="Favorite translation targets"></div>
          <p class="result-text" data-role="text"></p>
        </section>
        <section class="result-card" data-kind="rewrite" hidden>
          <header class="block-head">
            <span class="block-title">Rewrite</span>
            <span class="result-state" data-role="state"></span>
          </header>
          <p class="result-text" data-role="text"></p>
        </section>
      </div>

      <p class="status" aria-live="polite">Working…</p>
    </main>
  </body>
</html>
