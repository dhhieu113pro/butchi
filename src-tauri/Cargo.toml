[package]
name = "rust-rewrite"
version = "0.1.0"
description = "A cursor-adjacent translation and rewrite utility"
edition = "2021"

[lib]
name = "rust_rewrite_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
default = []
# Build with GPU acceleration when the matching SDK is installed:
#   cargo build --features cuda    # NVIDIA CUDA
#   cargo build --features vulkan  # Vulkan (Windows/Linux)
cuda = ["llama-cpp-2/cuda"]
vulkan = ["llama-cpp-2/vulkan"]

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-global-shortcut = "2.3.2"
tauri-plugin-single-instance = "2.4.3"
arboard = "3.6.1"
dirs = "6"
hf-hub = { version = "0.4", default-features = true }
llama-cpp-2 = { version = "0.1", features = ["sampler"] }
parking_lot = "0.12"
once_cell = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }
windows = { version = "0.61.3", features = [
    "Win32_System_Com",
    "Win32_UI_Accessibility",
] }
