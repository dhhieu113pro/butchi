[package]
name = "butchi"
version = "0.1.2"
description = "Butchi (bút chì) — cursor-adjacent translate and rewrite with a local LLM"
edition = "2021"

[lib]
name = "butchi_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
default = ["llm"]
# Local GGUF inference (llama-cpp-2).
llm = ["dep:llama-cpp-2", "dep:hf-hub", "dep:encoding_rs"]
# Build with GPU acceleration when the matching SDK is installed:
#   cargo build --features "llm,cuda"    # NVIDIA CUDA
#   cargo build --features "llm,vulkan"  # Vulkan (Windows/Linux)
cuda = ["llm", "llama-cpp-2/cuda"]
vulkan = ["llm", "llama-cpp-2/vulkan"]

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-single-instance = "2.4.3"
arboard = "3.6.1"
dirs = "6"
hf-hub = { version = "0.4", default-features = true, optional = true }
# llama.cpp OpenMP is intentionally disabled so Windows ARM64 links cleanly.
llama-cpp-2 = { version = "0.1", default-features = false, features = ["common", "sampler"], optional = true }
encoding_rs = { version = "0.8", optional = true }
parking_lot = "0.12"
once_cell = "1"
rusqlite = { version = "0.32", features = ["bundled"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }
windows = { version = "0.61.3", features = [
    "Win32_System_Com",
    "Win32_UI_Accessibility",
] }
