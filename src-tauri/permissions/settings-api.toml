[[permission]]
identifier = "allow-settings-api"
description = "Allow reading/writing settings, managing local LLM models, and viewing history."
commands.allow = [
  "get_config",
  "save_config",
  "list_models",
  "get_model_status",
  "download_model",
  "load_model",
  "list_history",
  "clear_history",
  "open_settings"
]
