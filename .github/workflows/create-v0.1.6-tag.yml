name: Create v0.1.6 Tag

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Verify version and create v0.1.6
        shell: bash
        run: |
          set -euo pipefail
          test "$(node -p "require('./package.json').version")" = "0.1.6"
          grep -q '^version = "0.1.6"$' src-tauri/Cargo.toml
          node -e "const c=require('./src-tauri/tauri.conf.json'); if(c.version!=='0.1.6') process.exit(1)"
          git fetch --tags origin
          if git rev-parse "v0.1.6" >/dev/null 2>&1; then
            echo "v0.1.6 already exists"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a v0.1.6 -m "Butchi v0.1.6"
          git push origin v0.1.6
