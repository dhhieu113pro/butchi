name: Task 13 Canonical Cutover Bootstrap

on:
  push:
    branches:
      - feat/avalonia-production-cutover

permissions:
  contents: write

jobs:
  import-validated-tree:
    runs-on: windows-latest
    steps:
      - name: Checkout canonical repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Import validated Avalonia tree except workflows
        shell: pwsh
        env:
          SOURCE_SHA: 7d11bba77a3943d18f4cbaf370dd62eb479729a6
          LEGACY_SHA: 2c37febcf79f4632c56143589b51164614092e4c
        run: |
          $ErrorActionPreference = 'Stop'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          $source = Join-Path $env:RUNNER_TEMP 'butchi-fake-source'
          git clone --no-checkout https://github.com/dhhieu113pro/butchi-fake.git $source
          git -C $source checkout --detach $env:SOURCE_SHA

          $actualSource = (git -C $source rev-parse HEAD).Trim()
          if ($actualSource -ne $env:SOURCE_SHA) {
            throw "Source SHA mismatch: expected $env:SOURCE_SHA, got $actualSource"
          }

          git merge-base --is-ancestor $env:LEGACY_SHA HEAD
          if ($LASTEXITCODE -ne 0) {
            throw "Canonical cutover branch no longer descends from legacy SHA $env:LEGACY_SHA"
          }

          $preserve = Join-Path $env:RUNNER_TEMP 'butchi-canonical-preserve'
          New-Item -ItemType Directory -Force $preserve | Out-Null
          foreach ($path in @('.gitignore', 'LICENSE', 'PRIVACY.md')) {
            if (Test-Path $path) {
              Copy-Item $path (Join-Path $preserve $path) -Force
            }
          }
          Copy-Item '.github/workflows' (Join-Path $preserve 'workflows') -Recurse -Force

          git rm -r .

          Get-ChildItem -Force $source |
            Where-Object { $_.Name -notin @('.git', '.github') } |
            ForEach-Object { Copy-Item $_.FullName -Destination . -Recurse -Force }

          New-Item -ItemType Directory -Force '.github' | Out-Null
          Copy-Item (Join-Path $preserve 'workflows') '.github/workflows' -Recurse -Force

          foreach ($path in @('.gitignore', 'LICENSE', 'PRIVACY.md')) {
            $saved = Join-Path $preserve $path
            if (Test-Path $saved) {
              Copy-Item $saved $path -Force
            }
          }

          git add -A
          git diff --cached --check

          $workflowDiff = git diff --cached --name-only -- '.github/workflows'
          if ($workflowDiff) {
            throw "Bootstrap must not modify workflow files: $($workflowDiff -join ', ')"
          }

          git commit -m 'feat: stage Avalonia production cutover tree'
          git push origin HEAD:feat/avalonia-production-cutover
