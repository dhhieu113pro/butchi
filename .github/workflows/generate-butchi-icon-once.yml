name: Generate Butchi icon once

on:
  push:
    branches:
      - fix/unify-butchi-app-icon

permissions:
  contents: write

jobs:
  generate-icon:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Generate committed ICO
        shell: pwsh
        run: |
          dnx ImageToIco.Dnx@0.0.4 --yes -- "assets/butchi-logo.svg" "src/Butchi.App/Assets/Butchi.ico" --overwrite
          if (-not (Test-Path "src/Butchi.App/Assets/Butchi.ico")) { throw "Butchi.ico was not generated" }

      - name: Commit generated icon and remove one-time workflow
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/Butchi.App/Assets/Butchi.ico
          git rm .github/workflows/generate-butchi-icon-once.yml
          git commit -m "chore: commit generated Butchi app icon"
          git push origin HEAD:fix/unify-butchi-app-icon
