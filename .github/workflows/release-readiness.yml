name: Release Readiness

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-readiness-${{ github.ref }}
  cancel-in-progress: true

# Exact-head composite evidence inherited through the reusable workflows below:
# - dotnet build Butchi.slnx / dotnet test Butchi.slnx
# - Capture deterministic Avalonia UI evidence (ui-screenshots)
# - win-x64 and win-arm64 self-contained publish smoke
# - Validate-StorePackage.ps1 for unsigned MSIX, .msixbundle and .msixupload outputs
# - New-CiMsixSigningCertificate.ps1 + Sign-CiMsix.ps1 on a CI-only x64 copy
# - Test-InstalledMsix.ps1 -> ReleaseProbe privacy/behavior validation -> Test-MsixUpgrade.ps1

jobs:
  ci:
    name: Build, tests, Task 14 screenshots, x64 and ARM64 publish
    uses: ./.github/workflows/ci.yml

  release:
    name: Store packages and installed lifecycle
    uses: ./.github/workflows/release.yml

  artifact-inventory:
    name: Validate public artifact inventory
    needs: [ci, release]
    runs-on: windows-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts/inventory

      - name: Validate ui-screenshots and artifact inventory
        shell: pwsh
        run: |
          $root = Join-Path $PWD 'artifacts/inventory'
          $files = @(Get-ChildItem $root -Recurse -File)
          if ($files.Count -eq 0) { throw 'Release-readiness artifact inventory is empty.' }

          # Private key material must never become a public workflow artifact.
          $forbiddenExtensions = @('.pfx', '.pvk', '.key')
          $forbidden = @($files | Where-Object {
            $forbiddenExtensions -contains $_.Extension.ToLowerInvariant() -or
            $_.FullName -match '(?i)ci-signing|ci-install|private.?key'
          })
          if ($forbidden.Count -gt 0) {
            throw "Artifact inventory contains forbidden private key/signing material: $($forbidden.FullName -join ', ')"
          }

          $pngs = @($files | Where-Object Extension -eq '.png')
          if ($pngs.Count -lt 10) { throw "Expected Task 14 screenshot evidence; found only $($pngs.Count) PNG files." }

          $x64 = @($files | Where-Object { $_.Name -match '(?i)_x64\.msix$' })
          $arm64 = @($files | Where-Object { $_.Name -match '(?i)_arm64\.msix$' })
          $bundles = @($files | Where-Object Extension -eq '.msixbundle')
          $uploads = @($files | Where-Object Extension -eq '.msixupload')
          if ($x64.Count -lt 1) { throw 'x64 production MSIX is missing from artifact inventory.' }
          if ($arm64.Count -lt 1) { throw 'ARM64 production MSIX is missing from artifact inventory.' }
          if ($bundles.Count -ne 1) { throw "Expected exactly one .msixbundle; found $($bundles.Count)." }
          if ($uploads.Count -ne 1) { throw "Expected exactly one .msixupload; found $($uploads.Count)." }

          foreach ($package in @($x64 + $arm64)) {
            $signature = Get-AuthenticodeSignature -FilePath $package.FullName
            if ($signature.Status -ne [System.Management.Automation.SignatureStatus]::NotSigned) {
              throw "Production Store package must remain NotSigned: $($package.FullName) ($($signature.Status))"
            }
          }

          $requiredArtifactRoots = @(
            'butchi-task14-ui-evidence',
            'butchi-msix-x64',
            'butchi-msix-arm64',
            'butchi-store-upload'
          )
          foreach ($artifactName in $requiredArtifactRoots) {
            if (-not (Test-Path (Join-Path $root $artifactName))) {
              throw "Required public artifact is missing: $artifactName"
            }
          }

          $inventoryPath = Join-Path $PWD 'artifact-inventory.txt'
          $files | ForEach-Object {
            $_.FullName.Substring($root.Length).TrimStart('\')
          } | Sort-Object | Set-Content $inventoryPath -Encoding utf8
          Write-Host "Validated artifact inventory with $($files.Count) public files."

      - uses: actions/upload-artifact@v4
        with:
          name: release-readiness-artifact-inventory
          path: artifact-inventory.txt
          if-no-files-found: error
          retention-days: 30
