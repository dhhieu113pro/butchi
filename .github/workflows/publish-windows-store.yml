name: Publish Windows Store MSIX

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-windows-store-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CMAKE_GENERATOR: Ninja

jobs:
  build-msix:
    name: Build MSIX (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            msvc_arch: x64
          - arch: arm64
            runner: windows-11-arm
            target: aarch64-pc-windows-msvc
            msvc_arch: arm64

    steps:
      - uses: actions/checkout@v4

      - name: Validate version and Store identity
        shell: pwsh
        env:
          STORE_PACKAGE_IDENTITY_NAME: ${{ secrets.STORE_PACKAGE_IDENTITY_NAME }}
          STORE_PACKAGE_PUBLISHER: ${{ secrets.STORE_PACKAGE_PUBLISHER }}
          STORE_PUBLISHER_DISPLAY_NAME: ${{ secrets.STORE_PUBLISHER_DISPLAY_NAME }}
        run: |
          foreach ($name in 'STORE_PACKAGE_IDENTITY_NAME','STORE_PACKAGE_PUBLISHER','STORE_PUBLISHER_DISPLAY_NAME') {
            if ([string]::IsNullOrWhiteSpace((Get-Item "env:$name").Value)) { throw "Missing $name secret" }
          }
          $tauri = Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          $package = Get-Content package.json -Raw | ConvertFrom-Json
          $cargoVersion = (Select-String src-tauri/Cargo.toml '^version\s*=\s*"([^"]+)"').Matches.Groups[1].Value
          $version = $tauri.version
          if ($package.version -ne $version -or $cargoVersion -ne $version) { throw "Version mismatch: tauri=$version npm=$($package.version) cargo=$cargoVersion" }
          if ('${{ github.ref_type }}' -eq 'tag') {
            $tagVersion = '${{ github.ref_name }}' -replace '^v',''
            if ($tagVersion -ne $version) { throw "Tag version $tagVersion does not match app version $version" }
          }
          $parts = $version.Split('.')
          while ($parts.Count -lt 4) { $parts += '0' }
          $msixVersion = ($parts[0..3] -join '.')
          "BUTCHI_VERSION=$version" >> $env:GITHUB_ENV
          "MSIX_VERSION=$msixVersion" >> $env:GITHUB_ENV

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.msvc_arch }}

      - uses: lukka/get-cmake@latest

      - name: Install Vulkan SDK
        shell: pwsh
        run: |
          $version = "1.3.296.0"
          $installer = "$env:RUNNER_TEMP\VulkanSDK-Installer.exe"
          $url = "https://sdk.lunarg.com/sdk/download/$version/windows/VulkanSDK-$version-Installer.exe"
          Write-Host "Downloading Vulkan SDK $version…"
          Invoke-WebRequest -Uri $url -OutFile $installer
          Start-Process -FilePath $installer -ArgumentList "--accept-licenses --default-answer --confirm-command install" -Wait
          $sdkRoot = "C:\VulkanSDK\$version"
          if (-not (Test-Path $sdkRoot)) {
            $sdkRoot = Get-ChildItem "C:\VulkanSDK" -Directory | Sort-Object Name -Descending | Select-Object -First 1 -ExpandProperty FullName
          }
          if (-not $sdkRoot) { throw "Vulkan SDK install path not found" }
          "VULKAN_SDK=$sdkRoot" >> $env:GITHUB_ENV
          "PATH=$sdkRoot\Bin;$env:PATH" >> $env:GITHUB_ENV
          Write-Host "VULKAN_SDK=$sdkRoot"

      - name: Configure clang-cl for ARM64 llama.cpp
        if: matrix.arch == 'arm64'
        shell: pwsh
        run: |
          $cmd = Get-Command clang-cl.exe -ErrorAction SilentlyContinue
          if ($cmd) { $clang = $cmd.Source } else {
            $clang = Get-ChildItem "$env:ProgramFiles\Microsoft Visual Studio\2022\Enterprise\VC\Tools\Llvm\*\bin\clang-cl.exe" -ErrorAction SilentlyContinue | Select-Object -First 1 -ExpandProperty FullName
          }
          if (-not $clang) { throw "clang-cl.exe not found" }
          "CC=$clang" >> $env:GITHUB_ENV
          "CXX=$clang" >> $env:GITHUB_ENV
          "CC_aarch64_pc_windows_msvc=$clang" >> $env:GITHUB_ENV
          "CXX_aarch64_pc_windows_msvc=$clang" >> $env:GITHUB_ENV
          "CXXFLAGS=/EHsc" >> $env:GITHUB_ENV
          "CXXFLAGS_aarch64_pc_windows_msvc=/EHsc" >> $env:GITHUB_ENV

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          shared-key: store-msix-vulkan-${{ matrix.arch }}

      - name: Install dependencies and test
        shell: pwsh
        run: |
          npm ci
          npm run build
          Push-Location src-tauri
          cargo test --all-targets -- --nocapture
          Pop-Location

      - name: Build Tauri executable
        shell: pwsh
        run: npm run tauri -- build --target ${{ matrix.target }} --no-bundle

      - name: Setup winapp CLI
        uses: microsoft/setup-WinAppCli@v0.2

      - name: Stage package and render manifest
        shell: pwsh
        env:
          STORE_PACKAGE_IDENTITY_NAME: ${{ secrets.STORE_PACKAGE_IDENTITY_NAME }}
          STORE_PACKAGE_PUBLISHER: ${{ secrets.STORE_PACKAGE_PUBLISHER }}
          STORE_PUBLISHER_DISPLAY_NAME: ${{ secrets.STORE_PUBLISHER_DISPLAY_NAME }}
        run: |
          $stage = "store-stage/${{ matrix.arch }}"
          New-Item -ItemType Directory -Force "$stage/Assets" | Out-Null
          $exe = "src-tauri/target/${{ matrix.target }}/release/butchi.exe"
          if (-not (Test-Path $exe)) { throw "Built executable not found: $exe" }
          Copy-Item $exe "$stage/butchi.exe"
          Copy-Item src-tauri/icons/StoreLogo.png "$stage/Assets/StoreLogo.png"
          Copy-Item src-tauri/icons/Square44x44Logo.png "$stage/Assets/Square44x44Logo.png"
          Copy-Item src-tauri/icons/Square150x150Logo.png "$stage/Assets/Square150x150Logo.png"
          $manifest = Get-Content store/Package.appxmanifest.template -Raw
          $manifest = $manifest.Replace('__PACKAGE_NAME__', $env:STORE_PACKAGE_IDENTITY_NAME)
          $manifest = $manifest.Replace('__PUBLISHER__', $env:STORE_PACKAGE_PUBLISHER)
          $manifest = $manifest.Replace('__PUBLISHER_DISPLAY_NAME__', $env:STORE_PUBLISHER_DISPLAY_NAME)
          $manifest = $manifest.Replace('__VERSION__', $env:MSIX_VERSION)
          Set-Content "$stage/Package.appxmanifest" $manifest -Encoding utf8

      - name: Pack unsigned Store MSIX
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist-store | Out-Null
          winapp pack "store-stage/${{ matrix.arch }}" --manifest "store-stage/${{ matrix.arch }}/Package.appxmanifest" --output dist-store
          $msix = Get-ChildItem dist-store -Filter '*.msix' | Select-Object -First 1
          if (-not $msix) { throw "MSIX was not generated" }
          Move-Item $msix.FullName "dist-store/Butchi_$env:BUTCHI_VERSION`_${{ matrix.arch }}.msix" -Force

      - uses: actions/upload-artifact@v4
        with:
          name: butchi-msix-${{ matrix.arch }}
          path: dist-store/*.msix
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Release and Microsoft Store submission
    needs: build-msix
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: butchi-msix-*
          path: artifacts
          merge-multiple: true

      - name: Create MSIX upload container
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $files = Get-ChildItem artifacts -Filter '*.msix'
          if ($files.Count -ne 2) { throw "Expected 2 MSIX packages, found $($files.Count)" }
          Compress-Archive -Path $files.FullName -DestinationPath "artifacts/Butchi_$version.zip" -Force
          Rename-Item "artifacts/Butchi_$version.zip" "Butchi_$version.msixupload"

      - name: Create GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/*.msix
            artifacts/*.msixupload
          body: |
            ## Butchi Microsoft Store package
            - x64 MSIX
            - ARM64 MSIX
            - combined MSIX upload package
            - Store submission packages are unsigned; Microsoft Store signs them after certification
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish MSIX artifacts to but-chi-installer
        if: github.ref_type == 'tag'
        shell: bash
        env:
          INSTALLER_REPO_TOKEN: ${{ secrets.INSTALLER_REPO_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
          INSTALLER_REPO: dhhieu113pro/but-chi-installer
        run: |
          set -euo pipefail
          test -n "${INSTALLER_REPO_TOKEN:-}" || { echo "Missing INSTALLER_REPO_TOKEN"; exit 1; }
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git clone "https://x-access-token:${INSTALLER_REPO_TOKEN}@github.com/${INSTALLER_REPO}.git" installer-repo
          cd installer-repo
          git checkout -B main
          mkdir -p "${RELEASE_TAG}" latest
          rm -f latest/*.msix latest/*.msixupload
          cp ../artifacts/*.msix ../artifacts/*.msixupload "${RELEASE_TAG}/"
          cp ../artifacts/*.msix ../artifacts/*.msixupload latest/
          cat > README.md <<EOF
          # Butchi Installers

          Microsoft Store MSIX packages published automatically from [dhhieu113pro/butchi](https://github.com/dhhieu113pro/butchi).

          Current version: **${RELEASE_TAG}**

          - \`latest/\` — newest MSIX artifacts
          - \`${RELEASE_TAG}/\` — immutable release artifacts
          EOF
          git add README.md "${RELEASE_TAG}" latest
          git diff --cached --quiet || { git commit -m "release: publish Butchi ${RELEASE_TAG} MSIX"; git push origin main; }

      - name: Configure Microsoft Store CLI
        if: github.ref_type == 'tag'
        uses: microsoft/microsoft-store-apppublisher@v1.1

      - name: Authenticate Microsoft Store CLI
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          AZURE_AD_TENANT_ID: ${{ secrets.AZURE_AD_TENANT_ID }}
          SELLER_ID: ${{ secrets.SELLER_ID }}
          AZURE_AD_APPLICATION_CLIENT_ID: ${{ secrets.AZURE_AD_APPLICATION_CLIENT_ID }}
          AZURE_AD_APPLICATION_SECRET: ${{ secrets.AZURE_AD_APPLICATION_SECRET }}
        run: |
          foreach ($name in 'AZURE_AD_TENANT_ID','SELLER_ID','AZURE_AD_APPLICATION_CLIENT_ID','AZURE_AD_APPLICATION_SECRET') {
            if ([string]::IsNullOrWhiteSpace((Get-Item "env:$name").Value)) { throw "Missing $name secret" }
          }
          msstore reconfigure `
            --tenantId $env:AZURE_AD_TENANT_ID `
            --sellerId $env:SELLER_ID `
            --clientId $env:AZURE_AD_APPLICATION_CLIENT_ID `
            --clientSecret $env:AZURE_AD_APPLICATION_SECRET

      - name: Submit package to Microsoft Store
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          STORE_PRODUCT_ID: ${{ secrets.STORE_PRODUCT_ID }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:STORE_PRODUCT_ID)) { throw "Missing STORE_PRODUCT_ID secret" }
          $upload = Get-ChildItem artifacts -Filter '*.msixupload' | Select-Object -First 1
          if (-not $upload) { throw "MSIX upload file not found" }
          msstore publish . --inputFile $upload.FullName --appId $env:STORE_PRODUCT_ID
