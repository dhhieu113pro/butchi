name: Create v0.1.4 Tag

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Create and push v0.1.4
        shell: bash
        run: |
          set -euo pipefail
          git fetch --tags origin
          if git rev-parse "v0.1.4" >/dev/null 2>&1; then
            echo "v0.1.4 already exists"
            exit 0
          fi
          git tag -a v0.1.4 -m "Butchi v0.1.4"
          git push origin v0.1.4
