name: UI Screenshots

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "index.html"
      - "settings.html"
      - "src/**"
      - "src-tauri/**"
      - "scripts/capture-ui.ps1"
      - ".github/workflows/screenshots.yml"
      - "docs/**"
  push:
    branches: [main]
    paths:
      - "index.html"
      - "settings.html"
      - "src/**"
      - "src-tauri/**"
      - "scripts/capture-ui.ps1"
      - ".github/workflows/screenshots.yml"
      - "docs/**"

permissions:
  contents: write

concurrency:
  group: ui-screenshots-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CMAKE_GENERATOR: Ninja

jobs:
  capture:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - uses: lukka/get-cmake@latest

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Build Butchi executable
        run: npm run tauri build -- --no-bundle

      - name: Locate executable
        id: app
        shell: pwsh
        run: |
          $candidate = Join-Path $PWD "src-tauri/target/release/butchi.exe"
          if (-not (Test-Path $candidate)) { throw "Butchi executable not found at $candidate" }
          "path=$candidate" >> $env:GITHUB_OUTPUT

      - name: Capture canonical UI screenshots
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Path docs/shots -Force | Out-Null
          $app = '${{ steps.app.outputs.path }}'

          function Capture-Butchi([string]$mode, [string]$title, [string]$output) {
            $env:BUTCHI_SCREENSHOT_MODE = $mode
            $process = Start-Process -FilePath $app -PassThru
            try {
              # Give WebView2 + frontend seed time before FindWindow polling.
              Start-Sleep -Seconds 5
              if ($process.HasExited) {
                throw "Butchi exited early in mode=$mode (exit=$($process.ExitCode))"
              }
              & ./scripts/capture-ui.ps1 -WindowTitle $title -OutputPath $output -TimeoutSeconds 45 -ProcessId $process.Id
            }
            finally {
              if ($process -and -not $process.HasExited) { Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue }
              Start-Sleep -Milliseconds 900
            }
          }

          Capture-Butchi 'popover-light' 'Text actions' 'docs/shots/popover-light.png'
          Capture-Butchi 'popover-dark' 'Text actions' 'docs/shots/popover-dark.png'
          Capture-Butchi 'settings-light' 'Butchi — Settings' 'docs/shots/settings-light.png'
          Capture-Butchi 'settings-dark' 'Butchi — Settings' 'docs/shots/settings-dark.png'

          Remove-Item Env:BUTCHI_SCREENSHOT_MODE -ErrorAction SilentlyContinue

      - name: Validate canonical screenshots
        shell: pwsh
        run: |
          $files = @(
            'docs/shots/popover-light.png',
            'docs/shots/popover-dark.png',
            'docs/shots/settings-light.png',
            'docs/shots/settings-dark.png'
          )
          foreach ($file in $files) {
            if (!(Test-Path $file)) { throw "Missing screenshot: $file" }
            $item = Get-Item $file
            if ($item.Length -lt 10000) { throw "Screenshot too small: $file ($($item.Length) bytes)" }
          }

      - name: Upload screenshot artifact
        uses: actions/upload-artifact@v4
        with:
          name: butchi-ui-screenshots
          path: docs/shots/*.png
          if-no-files-found: error
          retention-days: 30

      - name: Commit canonical screenshots
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/shots/*.png
          if git diff --cached --quiet; then
            echo "Canonical screenshots unchanged."
          else
            git commit -m "docs: refresh Butchi UI screenshots"
            git push
          fi
