name: Vision smoke

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/vision-smoke.yml'
      - '.ci/llamasharp-lfm25-vl-smoke/**'
      - 'src/Butchi.Core/Vision/**'
      - 'src/Butchi.Inference/**'
      - 'Directory.Packages.props'

permissions:
  contents: read

jobs:
  lfm25-vl:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Cache LFM2.5-VL smoke models
        uses: actions/cache@v4
        with:
          path: .ci/models/lfm25-vl-450m
          key: lfm25-vl-450m-q4-k-m-mmproj-q8-0-v1

      - name: Download model and projector
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .ci/models/lfm25-vl-450m
          model=.ci/models/lfm25-vl-450m/LFM2.5-VL-450M-Q4_K_M.gguf
          projector=.ci/models/lfm25-vl-450m/mmproj-LFM2.5-VL-450m-Q8_0.gguf
          if [[ ! -s "$model" ]]; then
            curl --fail --location --retry 3 \
              'https://huggingface.co/LiquidAI/LFM2.5-VL-450M-GGUF/resolve/main/LFM2.5-VL-450M-Q4_K_M.gguf?download=true' \
              --output "$model"
          fi
          if [[ ! -s "$projector" ]]; then
            curl --fail --location --retry 3 \
              'https://huggingface.co/LiquidAI/LFM2.5-VL-450M-GGUF/resolve/main/mmproj-LFM2.5-VL-450m-Q8_0.gguf?download=true' \
              --output "$projector"
          fi

      - name: Generate deterministic red-square image
        shell: python
        run: |
          import struct, zlib
          width = height = 64
          raw = b''.join(b'\x00' + b'\xff\x00\x00' * width for _ in range(height))
          def chunk(kind, data):
              return struct.pack('>I', len(data)) + kind + data + struct.pack('>I', zlib.crc32(kind + data) & 0xffffffff)
          png = b'\x89PNG\r\n\x1a\n'
          png += chunk(b'IHDR', struct.pack('>IIBBBBB', width, height, 8, 2, 0, 0, 0))
          png += chunk(b'IDAT', zlib.compress(raw))
          png += chunk(b'IEND', b'')
          open('.ci/models/lfm25-vl-450m/red.png', 'wb').write(png)

      - name: Run LLamaSharp LFM2.5-VL smoke
        shell: bash
        run: |
          dotnet run --project .ci/llamasharp-lfm25-vl-smoke/LLamaSharpLfm25VlSmoke.csproj -c Release -- \
            .ci/models/lfm25-vl-450m/LFM2.5-VL-450M-Q4_K_M.gguf \
            .ci/models/lfm25-vl-450m/mmproj-LFM2.5-VL-450m-Q8_0.gguf \
            .ci/models/lfm25-vl-450m/red.png
