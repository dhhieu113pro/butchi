name: .NET Migration CI
on:
  push:
    branches: [design/avalonia-llamasharp-migration]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
concurrency:
  group: dotnet-migration-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  core-red-green:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Test Core architecture
        run: dotnet test tests-dotnet/Butchi.Core.Tests/Butchi.Core.Tests.csproj
