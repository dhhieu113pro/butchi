name: Create v0.1.5 Tag

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/create-v0.1.5-tag.yml"

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Verify version and create v0.1.5
        shell: bash
        run: |
          set -euo pipefail
          test "$(node -p "require('./package.json').version")" = "0.1.5"
          grep -q '^version = "0.1.5"$' src-tauri/Cargo.toml
          node -e "const c=require('./src-tauri/tauri.conf.json'); if(c.version!=='0.1.5') process.exit(1)"
          git fetch --tags origin
          if git rev-parse "v0.1.5" >/dev/null 2>&1; then
            echo "v0.1.5 already exists"
            exit 0
          fi
          git tag -a v0.1.5 -m "Butchi v0.1.5"
          git push origin v0.1.5
