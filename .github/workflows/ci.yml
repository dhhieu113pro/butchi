name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            cmake \
            pkg-config \
            libclang-dev \
            clang \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev

      - name: Install macOS build dependencies
        if: runner.os == 'macOS'
        run: |
          brew install cmake || true

      - name: Install Windows build dependencies
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          # CMake is usually preinstalled on windows-latest; choco is slow/flaky.
          cmake --version
        continue-on-error: true

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          shared-key: ${{ runner.os }}-cpu

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Typecheck frontend
        run: npx tsc --noEmit

      # Note: --locked omitted until Cargo.lock is committed in sync with Cargo.toml
      # (target-specific windows deps change required a lockfile refresh).
      - name: Cargo check (CPU)
        working-directory: src-tauri
        run: cargo check

      - name: Cargo test (CPU)
        working-directory: src-tauri
        run: cargo test -- --nocapture

      - name: Cargo clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings
        continue-on-error: true

  feature-gate:
    name: Feature gate (Linux)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake pkg-config libclang-dev clang \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf libssl-dev

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          shared-key: linux-feature-gate

      - name: cargo check --features vulkan (best-effort)
        working-directory: src-tauri
        run: |
          cargo check --features vulkan || echo "vulkan feature check skipped/failed (expected without SDK)"
        continue-on-error: true
