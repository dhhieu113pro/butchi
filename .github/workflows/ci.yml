name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CMAKE_GENERATOR: Ninja

jobs:
  test:
    name: Test (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: windows-x64
            runner: windows-latest
          - arch: windows-arm64
            runner: windows-11-arm

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Windows build dependencies
        uses: ilammy/msvc-dev-cmd@v1

      - name: Setup CMake (Windows)
        uses: lukka/get-cmake@latest

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          shared-key: ${{ matrix.arch }}-cpu-v4-nollm

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Typecheck frontend
        run: npx tsc --noEmit

      # Skip feature `llm` on CI — llama-cpp-sys-2 native build is slow/flaky on GHA.
      - name: Cargo check (no llm)
        working-directory: src-tauri
        run: cargo check --no-default-features

      - name: Cargo test (no llm)
        working-directory: src-tauri
        run: cargo test --no-default-features -- --nocapture

      - name: Cargo clippy
        working-directory: src-tauri
        run: cargo clippy --no-default-features --all-targets -- -D warnings
        continue-on-error: true
