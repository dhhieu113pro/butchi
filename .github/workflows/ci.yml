name: CI

on:
  push:
    branches: [main, feat/avalonia-foundation, 'feat/task14-*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Verify production cutover contract
        shell: pwsh
        run: ./scripts/verify-production-cutover.ps1
      - name: Restore
        run: dotnet restore Butchi.slnx
      - name: Build
        run: dotnet build Butchi.slnx -c Release --no-restore
      - name: Test
        run: dotnet test Butchi.slnx -c Release --no-build

  screenshot-smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Capture real Avalonia UI
        shell: pwsh
        run: |
          dotnet run --project src/Butchi.App/Butchi.App.csproj -c Release -- --screenshot-popover "artifacts/ui/popover.png"
          $popover = "artifacts/ui/popover.png"
          if (-not (Test-Path $popover)) { throw "Screenshot missing: $popover" }
          if ((Get-Item $popover).Length -le 1024) { throw "Screenshot unexpectedly small: $popover" }

          $pages = @('settings', 'prompts', 'history', 'models', 'status')
          foreach ($page in $pages) {
            dotnet run --project src/Butchi.App/Butchi.App.csproj -c Release -- --screenshot "artifacts/ui/$page.png" --page $page --width 1440 --height 900
            $path = "artifacts/ui/$page.png"
            if (-not (Test-Path $path)) { throw "Screenshot missing: $path" }
            if ((Get-Item $path).Length -le 1024) { throw "Screenshot unexpectedly small: $path" }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: butchi-ui-screenshots
          path: artifacts/ui/*.png
          if-no-files-found: error

  publish-smoke:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        rid: [win-x64, win-arm64]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Publish ${{ matrix.rid }}
        run: dotnet publish src/Butchi.App/Butchi.App.csproj -c Release -r ${{ matrix.rid }} --self-contained true -o artifacts/${{ matrix.rid }}
      - name: Verify executable
        shell: pwsh
        run: |
          if (-not (Test-Path "artifacts/${{ matrix.rid }}/Butchi.App.exe")) { throw "Butchi.App.exe missing for ${{ matrix.rid }}" }
