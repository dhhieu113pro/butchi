# Final composite gate: .github/workflows/release-readiness.yml
name: CI

on:
  push:
    branches: [main, feat/avalonia-foundation, 'feat/task14-*']
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:

jobs:
  build-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Verify production cutover contract
        shell: pwsh
        run: ./scripts/verify-production-cutover.ps1
      - name: Restore
        run: dotnet restore Butchi.slnx
      - name: Build
        run: dotnet build Butchi.slnx -c Release --no-restore
      - name: Test with coverage
        run: dotnet test Butchi.slnx -c Release --no-build --collect:"XPlat Code Coverage" --results-directory TestResults -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=cobertura
      - name: Verify coverage baseline
        shell: pwsh
        run: ./scripts/verify-coverage-baseline.ps1 -CoverageRoot TestResults -MinimumLineCoverage 39.0
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: butchi-code-coverage
          path: |
            TestResults/**/coverage.cobertura.xml
            artifacts/coverage/coverage-summary.json
          if-no-files-found: error

  screenshot-smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Capture deterministic Avalonia UI evidence
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Drawing

          function Assert-VisualEvidence([string]$path) {
            if (-not (Test-Path $path)) { throw "Screenshot missing: $path" }
            if ((Get-Item $path).Length -le 1024) { throw "Screenshot unexpectedly small: $path" }
          }

          function Assert-ManagementPng([string]$path) {
            Assert-VisualEvidence $path
            $image = [System.Drawing.Image]::FromFile((Resolve-Path $path))
            try {
              if ($image.Width -ne 1440) { throw "Unexpected screenshot width for ${path}: $($image.Width)" }
              if ($image.Height -ne 900) { throw "Unexpected screenshot height for ${path}: $($image.Height)" }
            }
            finally {
              $image.Dispose()
            }
          }

          dotnet run --project src/Butchi.App/Butchi.App.csproj -c Release -- --screenshot-popover "artifacts/ui/popover-light.png" --theme light
          Assert-VisualEvidence "artifacts/ui/popover-light.png"
          dotnet run --project src/Butchi.App/Butchi.App.csproj -c Release -- --screenshot-popover "artifacts/ui/popover-dark.png" --theme dark
          Assert-VisualEvidence "artifacts/ui/popover-dark.png"

          $popoverFixtures = @{
            'popover-idle.png' = 'idle'
            'popover-loading.png' = 'loading'
            'popover-error.png' = 'error'
          }
          foreach ($entry in $popoverFixtures.GetEnumerator()) {
            $path = "artifacts/ui/$($entry.Key)"
            dotnet run --project src/Butchi.App/Butchi.App.csproj -c Release -- --screenshot-popover $path --fixture $entry.Value --theme light
            Assert-VisualEvidence $path
          }

          dotnet run --project src/Butchi.App/Butchi.App.csproj -c Release -- --screenshot "artifacts/ui/settings-light.png" --page settings --width 1440 --height 900 --theme light
          Assert-ManagementPng "artifacts/ui/settings-light.png"
          dotnet run --project src/Butchi.App/Butchi.App.csproj -c Release -- --screenshot "artifacts/ui/settings-dark.png" --page settings --width 1440 --height 900 --theme dark
          Assert-ManagementPng "artifacts/ui/settings-dark.png"

          $pages = @('prompts', 'history', 'models', 'status')
          foreach ($page in $pages) {
            dotnet run --project src/Butchi.App/Butchi.App.csproj -c Release -- --screenshot "artifacts/ui/$page.png" --page $page --width 1440 --height 900 --theme light
            Assert-ManagementPng "artifacts/ui/$page.png"
          }

          dotnet run --project src/Butchi.App/Butchi.App.csproj -c Release -- --screenshot "artifacts/ui/history-empty.png" --page history --fixture empty --width 1440 --height 900 --theme light
          Assert-ManagementPng "artifacts/ui/history-empty.png"
      - uses: actions/upload-artifact@v4
        with:
          name: butchi-task14-ui-evidence
          path: artifacts/ui/*.png
          if-no-files-found: error

  publish-smoke:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        rid: [win-x64, win-arm64]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Publish ${{ matrix.rid }}
        run: dotnet publish src/Butchi.App/Butchi.App.csproj -c Release -r ${{ matrix.rid }} --self-contained true -o artifacts/${{ matrix.rid }}
      - name: Verify executable
        shell: pwsh
        run: |
          if (-not (Test-Path "artifacts/${{ matrix.rid }}/Butchi.App.exe")) { throw "Butchi.App.exe missing for ${{ matrix.rid }}" }
