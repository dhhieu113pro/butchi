name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CMAKE_GENERATOR: Ninja

jobs:
  test:
    name: Test (${{ matrix.arch }}, llm)
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: windows-x64
            runner: windows-latest
            msvc_arch: x64
          - arch: windows-arm64
            runner: windows-11-arm
            msvc_arch: arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Windows build dependencies
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.msvc_arch }}

      - name: Setup CMake (Windows)
        uses: lukka/get-cmake@latest

      # llama.cpp intentionally rejects the MSVC compiler for Windows ARM.
      # Keep the MSVC SDK/linker environment, but compile its native C/C++
      # sources with clang-cl on ARM64.
      - name: Configure clang-cl for ARM64 llama.cpp
        if: matrix.arch == 'windows-arm64'
        shell: pwsh
        run: |
          $cmd = Get-Command clang-cl.exe -ErrorAction SilentlyContinue
          if ($cmd) {
            $clang = $cmd.Source
          } else {
            $candidates = @(
              "$env:ProgramFiles\Microsoft Visual Studio\2022\Enterprise\VC\Tools\Llvm\ARM64\bin\clang-cl.exe",
              "$env:ProgramFiles\Microsoft Visual Studio\2022\Enterprise\VC\Tools\Llvm\x64\bin\clang-cl.exe"
            )
            $clang = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          }
          if (-not $clang) { throw "clang-cl.exe was not found on the ARM64 runner" }
          Write-Host "Using clang-cl: $clang"
          & $clang --version
          "CC=$clang" >> $env:GITHUB_ENV
          "CXX=$clang" >> $env:GITHUB_ENV
          "CC_aarch64_pc_windows_msvc=$clang" >> $env:GITHUB_ENV
          "CXX_aarch64_pc_windows_msvc=$clang" >> $env:GITHUB_ENV

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          shared-key: ${{ matrix.arch }}-cpu-v6-llm-clang

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Typecheck frontend
        run: npx tsc --noEmit

      # `llm` is a default feature and is core to Butchi's translate/rewrite path.
      # Keep default features enabled so CI compiles llama-cpp-2 and hf-hub.
      - name: Cargo check (llm)
        working-directory: src-tauri
        run: cargo check

      - name: Cargo test (llm)
        working-directory: src-tauri
        run: cargo test -- --nocapture

      - name: Cargo clippy (llm)
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings
        continue-on-error: true
