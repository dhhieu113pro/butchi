[package]
name = "rust-rewrite"
version = "0.1.0"
edition = "2021"
description = "A self-contained Windows desktop system tray application to rewrite English grammar using local embedded LLM on double-Ctrl press."

[dependencies]
# Pure Rust Embedded ML / GGUF Inference Engine
candle-core = "0.8"
candle-transformers = "0.8"
tokenizers = "0.21"

# Async runtime and networking
tokio = { version = "1.43", features = ["full"] }
reqwest = { version = "0.12", features = ["stream"] }
futures-util = "0.3"

# System Keystrokes & Clipboard
arboard = "3.4"

# Serialization and Config
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
anyhow = "1.0"
directories = "6.0"

# Windows Low-Level API Hooks & System Tray
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_Graphics_Gdi"
] }
