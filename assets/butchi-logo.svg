<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">Butchi</title>
  <desc id="desc">Butchi app icon: a simple pencil for fast local writing tools.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#58c7f4"/>
      <stop offset="0.52" stop-color="#3f8ff5"/>
      <stop offset="1" stop-color="#4455f6"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e8f0ff"/>
    </linearGradient>
    <linearGradient id="eraser" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe66d"/>
      <stop offset="1" stop-color="#ffad28"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="180%" height="180%">
      <feDropShadow dx="24" dy="34" stdDeviation="24" flood-color="#162a8c" flood-opacity=".30"/>
    </filter>
  </defs>

  <rect x="72" y="72" width="880" height="880" rx="210" fill="url(#background)"/>

  <g id="pencil" transform="rotate(-43 512 512)" filter="url(#shadow)">
    <path d="M178 438 286 366v292l-108-72-48-74z" fill="#ffe9c8"/>
    <path d="M178 438v148l-48-74z" fill="#283044"/>
    <rect x="278" y="366" width="468" height="292" rx="54" fill="url(#body)"/>
    <rect x="338" y="410" width="330" height="34" rx="17" fill="#c6d8f6" opacity=".9"/>
    <rect x="704" y="366" width="62" height="292" fill="#edf3ff"/>
    <rect x="752" y="366" width="142" height="292" rx="54" fill="url(#eraser)"/>
  </g>
</svg>
